[project]
name = "stockchart"
version = "0.1.0.dev0"
description = "A creative plotting toolkit that draws data as stockings pulled up over a pair of legs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "skia-python>=144.1",
    "numpy>=2.5",
    "pillow>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "pyright>=1.1.414",
    # 仅 tools/split_master.py 的素材管线使用，不进入运行时依赖：
    # scipy 用于切分连通域，vtracer 用于把超分母图追踪成 SVG
    "scipy>=1.18",
    "vtracer>=0.6.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockchart"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
# 中文注释/文档约定与部分规则的冲突：
# RUF001/002/003 把中文全角标点判为歧义 Unicode；D400/D415 不认中文句号；
# D105 魔法方法（如 __post_init__）不强制文档。
ignore = ["D203", "D213", "RUF001", "RUF002", "RUF003", "D400", "D415", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
# tools/ 不做类型检查：开发脚本依赖无 stub 的 scipy，且非公开 API（ruff 仍检查风格）
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
