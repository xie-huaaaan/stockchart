name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing 必需
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Rewrite README links to absolute URLs (PyPI has no repo context)
        run: uv run python tools/pypi_readme.py README.md --in-place
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1